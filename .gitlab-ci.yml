# GitLab build-only pipeline for CopyPolish.
# GitHub is the development and public-release platform. GitLab runs only when
# GitHub pushes a v* release tag to this project.

stages:
  - build
  - package
  - release

variables:
  NODE_VERSION: "24.19.0"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
    - when: never

.rules_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

build:linux:
  stage: build
  image: rust:1.98-bookworm
  timeout: 60 minutes
  cache:
    key:
      files:
        - frontend/package-lock.json
        - src-tauri/Cargo.lock
      prefix: copypolish-linux-v1
    paths:
      - .cargo/
      - src-tauri/target/
      - frontend/.npm/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl git python3 ca-certificates pkg-config xz-utils
    - apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ --strip-components=1 -C /usr/local
  script:
    - python3 scripts/prepare_release_version.py "$CI_COMMIT_TAG"
    - python3 scripts/check_version.py "$CI_COMMIT_TAG"
    - npm ci --prefix frontend --cache frontend/.npm
    - npm run tauri --prefix frontend -- build
    - mkdir -p dist/linux
    - find src-tauri/target/release/bundle -name '*.deb' -exec cp {} dist/linux/CopyPolish_linux_amd64.deb \;
    - find src-tauri/target/release/bundle -name '*.rpm' -exec cp {} dist/linux/CopyPolish-linux-x86_64.rpm \;
    - find src-tauri/target/release/bundle -name '*.AppImage' -exec cp {} dist/linux/CopyPolish_linux_amd64.AppImage \;
    - python3 scripts/verify_release_assets.py "$CI_COMMIT_TAG" --dist-dir dist/linux --platform linux
  artifacts:
    name: linux-bundles-$CI_COMMIT_TAG
    paths:
      - dist/linux/
    expire_in: 3 days
  rules: !reference [.rules_tag, rules]

build:windows:
  stage: build
  timeout: 90 minutes
  tags:
    - saas-windows-medium-amd64
  script:
    - |
      $ErrorActionPreference = 'Stop'
      & powershell.exe -NoProfile -ExecutionPolicy Bypass `
        -File .\scripts\ci\build_windows_gitlab.ps1 `
        -Tag $env:CI_COMMIT_TAG
      if ($LASTEXITCODE -ne 0) { throw "Windows build failed: $LASTEXITCODE" }
  artifacts:
    name: windows-portable-$CI_COMMIT_TAG
    paths:
      - dist/windows/
    expire_in: 3 days
  rules: !reference [.rules_tag, rules]

package:assemble:
  stage: package
  image: alpine:3.20
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  before_script:
    - apk add --no-cache python3 coreutils p7zip
  script:
    - mkdir -p dist/final
    - cp dist/linux/CopyPolish_linux_amd64.deb dist/final/
    - cp dist/linux/CopyPolish-linux-x86_64.rpm dist/final/
    - cp dist/linux/CopyPolish_linux_amd64.AppImage dist/final/
    - cp dist/windows/CopyPolish.exe dist/final/
    - cp dist/windows/CopyPolish-windows-x64.7z dist/final/
    - python3 scripts/verify_release_assets.py "$CI_COMMIT_TAG" --dist-dir dist/final --platform all
    - cd dist/final && sha256sum CopyPolish.exe CopyPolish-windows-x64.7z CopyPolish_linux_amd64.deb CopyPolish-linux-x86_64.rpm CopyPolish_linux_amd64.AppImage > SHA256SUMS && sha256sum -c SHA256SUMS
  artifacts:
    name: release-files-$CI_COMMIT_TAG
    paths:
      - dist/final/
    expire_in: 3 days
  rules: !reference [.rules_tag, rules]

release:gitlab:
  stage: release
  image: alpine:3.20
  needs:
    - job: package:assemble
      artifacts: true
  timeout: 20 minutes
  resource_group: release-$CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl python3
  script:
    - |
      BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/copypolish/${CI_COMMIT_TAG}"
      for f in CopyPolish.exe CopyPolish-windows-x64.7z CopyPolish_linux_amd64.deb CopyPolish-linux-x86_64.rpm CopyPolish_linux_amd64.AppImage SHA256SUMS; do
        curl --fail --show-error --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "dist/final/${f}" "${BASE_URL}/${f}"
      done
    - python3 scripts/ci/create_gitlab_release.py
  rules: !reference [.rules_tag, rules]