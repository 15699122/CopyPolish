name: build-windows-exe

on:
  push:
    paths:
      - 'chinese_copywriting_formatter.py'
      - 'ccw_engine.py'
      - 'rules.yaml'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install -U pyinstaller customtkinter

      - name: Build one-file exe
        working-directory: chinese_copywriting_formatter
        run: |
          python -m PyInstaller ^
            --onefile ^
            --windowed ^
            --name chinese_copywriting_formatter ^
            --collect-tcl-data ^
            --collect-data customtkinter ^
            --add-data "rules.yaml;." ^
            chinese_copywriting_formatter.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chinese_copywriting_formatter-exe
          path: chinese_copywriting_formatter\dist\chinese_copywriting_formatter.exe
          if-no-files-found: error
