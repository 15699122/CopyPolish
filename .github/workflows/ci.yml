name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# 决策记录：GitHub Actions 暂时禁用（账户计费阻塞），常规验证与 Release 构建由
# GitLab tag pipeline 承担。每个 job 由仓库 Variable ACTIONS_ENABLED 守卫；
# 解除阻塞后在仓库 Settings > Variables 将 ACTIONS_ENABLED 设为 true 即可恢复。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:

    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Rust validation
        run: python3 scripts/verify.py --profile rust

  frontend:

    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    name: Frontend (vitest / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend validation
        run: python3 scripts/verify.py --profile frontend

  checks:

    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    name: Security and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 scripts/verify.py --profile checks