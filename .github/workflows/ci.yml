name: ci

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch: {}

# 同一 PR / 分支只保留最新一次 CI：新 commit 到达时自动取消过时 run，节省 minutes。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 正常 run 约 5–10 分钟；超时上限用于防止网络/构建挂起长期占用 runner。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 纯 Rust 测试不链接 GTK/WebKitGTK，无需安装 Tauri Linux 系统依赖。
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Print tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          python3 --version
          uname -a
          cat /etc/os-release

      - name: Rust tests (default, pure-Rust build)
        working-directory: src-tauri
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test

      - name: Patch formatting check
        run: git diff --check

      - name: Frontend typecheck, tests & build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build