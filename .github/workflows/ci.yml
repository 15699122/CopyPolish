name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# 决策记录：早期因账户计费问题暂时禁用过 GitHub Actions；现已恢复启用，
# 常规分支 CI 在 GitHub Actions 上运行。每个 job 仍由仓库 Variable
# ACTIONS_ENABLED 守卫，可在仓库 Settings > Variables 中随时启停。
# 跨平台 Release 构建见 .github/workflows/release.yml（手动两阶段触发）。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:

    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Rust validation
        run: python3 scripts/verify.py --profile rust

  frontend:

    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    name: Frontend (vitest / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend validation
        run: python3 scripts/verify.py --profile frontend

  checks:

    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    name: Security and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 scripts/verify.py --profile checks