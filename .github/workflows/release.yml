name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to orchestrate
        required: true
        type: string
      prerelease:
        description: Mark GitHub Release as pre-release
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID || '85804438' }}
  GITLAB_REPOSITORY_URL: ${{ vars.GITLAB_REPOSITORY_URL || 'https://gitlab.com/olivaceum-group/chinese_copywriting_formatter.git' }}

jobs:
  verify-github-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          INPUT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          test "$INPUT_TAG" = "$(git describe --tags --exact-match HEAD)"
          sha="$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")"
          [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          prerelease=false
          [[ "$INPUT_TAG" == *-* ]] && prerelease=true
          [[ "$INPUT_PRERELEASE" == true ]] && prerelease=true
          {
            echo "tag=$INPUT_TAG"
            echo "sha=$sha"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - run: python3 scripts/check_version.py "${{ steps.meta.outputs.tag }}"

  sync-tag-to-gitlab:
    needs: verify-github-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-github-tag.outputs.tag }}
      - name: Push exact tag to GitLab build service
        env:
          GITLAB_RELEASE_BRIDGE_TOKEN: ${{ secrets.GITLAB_RELEASE_BRIDGE_TOKEN }}
        run: |
          test -n "$GITLAB_RELEASE_BRIDGE_TOKEN"
          chmod +x scripts/ci/push_tag_to_gitlab.sh
          scripts/ci/push_tag_to_gitlab.sh "${{ needs.verify-github-tag.outputs.tag }}"

  wait-for-gitlab:
    needs: [verify-github-tag, sync-tag-to-gitlab]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-github-tag.outputs.tag }}
      - name: Wait for GitLab build-only pipeline
        env:
          GITLAB_RELEASE_BRIDGE_TOKEN: ${{ secrets.GITLAB_RELEASE_BRIDGE_TOKEN }}
          GITHUB_TAG_SHA: ${{ needs.verify-github-tag.outputs.sha }}
          RELEASE_TAG: ${{ needs.verify-github-tag.outputs.tag }}
          GITLAB_PIPELINE_TIMEOUT_SECONDS: 5400
        run: python3 scripts/ci/wait_for_gitlab_pipeline.py "$RELEASE_TAG"

  download-gitlab-assets:
    needs: [verify-github-tag, wait-for-gitlab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-github-tag.outputs.tag }}
      - name: Download and verify GitLab assets
        env:
          GITLAB_RELEASE_BRIDGE_TOKEN: ${{ secrets.GITLAB_RELEASE_BRIDGE_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-github-tag.outputs.tag }}
        run: |
          python3 scripts/ci/download_gitlab_release_assets.py "$RELEASE_TAG" release-files
          python3 scripts/verify_release_assets.py "$RELEASE_TAG" --dist-dir release-files --platform all
      - uses: actions/upload-artifact@v7
        with:
          name: gitlab-release-assets
          path: release-files/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  windows-smoke:
    needs: [verify-github-tag, download-gitlab-assets]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gitlab-release-assets
          path: release-files
      - name: Launch and verify GitLab-built executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "release-files/CopyPolish.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
              $p.Refresh()
              if ($p.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($p.MainWindowHandle -eq 0) { throw 'Main window did not appear within 60s' }
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw 'App exited during stability wait' }
            Write-Host "Smoke OK: $($p.MainWindowTitle)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

  create-github-release:
    needs: [verify-github-tag, download-gitlab-assets, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-github-tag.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: gitlab-release-assets
          path: release-files
      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-github-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-github-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then flags=(--prerelease); fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}" \
            release-files/CopyPolish.exe \
            release-files/CopyPolish-windows-x64.7z \
            release-files/CopyPolish_linux_amd64.deb \
            release-files/CopyPolish-linux-x86_64.rpm \
            release-files/CopyPolish_linux_amd64.AppImage \
            release-files/SHA256SUMS