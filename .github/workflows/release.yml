name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string
      prerelease:
        description: Mark GitHub Release as pre-release
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify version consistency
        run: python3 scripts/check_version.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      # 把 tag 的完整版本（含预发布后缀）写入构建配置，
      # 使打包产物的 getVersion() 与 GitHub tag 一致。
      - name: Sync full release version from tag
        run: python3 scripts/prepare_release_version.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Print tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          python3 --version
          uname -a
          cat /etc/os-release

      - name: Rust tests (default, pure-Rust build)
        working-directory: src-tauri
        run: cargo fmt --check && cargo test

      - name: Frontend typecheck, tests & build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build

  tauri-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          # Windows 仅提供便携版：不生成安装器，直接产出 release .exe，
          # 由后续步骤打包为 .7z。
          - os: windows-latest
            args: "--no-bundle"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # 打包前同步 tag 的完整版本（含预发布后缀）到构建配置。
      - name: Sync full release version from tag
        run: python3 scripts/prepare_release_version.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Print tool versions
        shell: bash
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          if command -v uname >/dev/null 2>&1; then uname -a; fi

      - name: Build bundles
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.args }}

      # Linux：上传 Tauri bundle（deb/rpm/AppImage）。
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bundle-ubuntu-latest
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error

      # Windows：便携版发布 —— 仅 .exe 与 .7z 压缩包，无安装器。
      - name: Package Windows portable (exe + 7z)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/chinese-copywriting-formatter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Executable not found: $exe" }
          $staging = Join-Path $PWD "windows-portable-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe (Join-Path $staging "CopyPolish.exe")
          # 若未来构建产出旁置 DLL，连同 exe 一起带入；不引入目录层级。
          Get-ChildItem (Split-Path $exe) -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $staging
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "<program-files-path> }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = Join-Path $PWD "dist\windows-portable.7z"
          $files = Get-ChildItem $staging -File | ForEach-Object { $_.Name }
          Push-Location $staging
          try {
            & $sevenZip a -t7z -mx=9 $archive $files
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "7z failed with exit code $LASTEXITCODE"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Move-Item $archive "dist/windows/CopyPolish-windows-x64.7z" -Force
          Copy-Item (Join-Path $staging "CopyPolish.exe") "dist/windows/CopyPolish.exe"
          Remove-Item $staging -Recurse -Force
          Get-ChildItem dist/windows

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: windows-portable
          path: |
            dist/windows/CopyPolish.exe
            dist/windows/CopyPolish-windows-x64.7z
          if-no-files-found: error

      # 构建失败时上传日志辅助排查。
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-log-${{ matrix.os }}
          path: |
            src-tauri/target/release/**/*.log
            frontend/npm-debug.log*
          if-no-files-found: ignore

  # Windows hosted runner 冒烟测试：真实启动 GUI，校验进程存活且主窗口出现。
  windows-smoke:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # 冒烟测试构建同样使用 tag 的完整版本，保证与发布产物一致。
      - name: Sync full release version from tag
        shell: bash
        run: python3 scripts/prepare_release_version.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Print tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsHardwareAbstractionLayer

      - name: Build app (skip bundling)
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- --no-bundle

      - name: Launch and verify main window
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/chinese-copywriting-formatter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Executable not found: $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru
          try {
            # 等待 WebView2 初始化并创建主窗口。
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              if ($p.HasExited) {
                Write-Error "App exited early with code $($p.ExitCode)"; exit 1
              }
              $p.Refresh()
              if ($p.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($p.HasExited) { Write-Error "App exited before showing window"; exit 1 }
            if ($p.MainWindowHandle -eq 0) {
              Write-Error "Main window did not appear within 60s"; exit 1
            }
            Write-Host "Smoke OK: process $($p.Id) alive, window '$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
            # 再保持 10 秒确认稳定运行不崩溃。
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { Write-Error "App exited during stability wait"; exit 1 }
            Write-Host "Stability OK"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

  release:
    needs: [test, tauri-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect release files (ASCII names)
        run: |
          mkdir -p release-files
          cp dist/windows-portable/CopyPolish.exe release-files/
          cp dist/windows-portable/CopyPolish-windows-x64.7z release-files/
          find dist/bundle-ubuntu-latest -name '*.deb' -exec cp {} release-files/CopyPolish_linux_amd64.deb \;
          find dist/bundle-ubuntu-latest -name '*.rpm' -exec cp {} release-files/CopyPolish-linux-x86_64.rpm \;
          find dist/bundle-ubuntu-latest -name '*.AppImage' -exec cp {} release-files/CopyPolish_linux_amd64.AppImage \;
          ls -la release-files

      # 自动生成 Release Notes；预发布 tag（含 "-"）或手动勾选时标记为 prerelease 且不占用 latest。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true || github.event_name == 'push' && contains(github.ref_name, '-') }}
        run: |
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          else
            FLAGS="--latest"
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            $FLAGS \
            release-files/*

      - name: Verify version consistency
        run: python3 scripts/check_version.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"