name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Rust tests (default, pure-Rust build)
        working-directory: src-tauri
        run: cargo fmt --check && cargo test
      - name: Frontend typecheck, tests & build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundles
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.args }}

      # 分发产物：上传 Linux/Windows bundle。
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error
      # 构建失败时上传日志辅助排查。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.os }}
          path: |
            src-tauri/target/release/**/*.log
            frontend/npm-debug.log*
          if-no-files-found: ignore
