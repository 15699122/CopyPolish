name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version consistency (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check_version.py "${{ github.ref_name }}"
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Rust tests (default, pure-Rust build)
        working-directory: src-tauri
        run: cargo fmt --check && cargo test
      - name: Frontend typecheck, tests & build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          # Windows 仅提供便携版：不生成安装器，直接产出 release .exe，
          # 由后续步骤打包为 .7z。
          - os: windows-latest
            args: "--no-bundle"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundles
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.args }}

      # Linux：上传 Tauri bundle（deb/rpm/AppImage）。
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bundle-ubuntu-latest
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error

      # Windows：便携版发布 —— 仅 .exe 与 .7z 压缩包，无安装器。
      - name: Package Windows portable (exe + 7z)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/chinese-copywriting-formatter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Executable not found: $exe" }
          $staging = Join-Path $PWD "windows-portable-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe (Join-Path $staging "CopyPolish.exe")
          # 若未来构建产出旁置 DLL，连同 exe 一起带入；不引入目录层级。
          Get-ChildItem (Split-Path $exe) -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $staging
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = Join-Path $PWD "dist\windows-portable.7z"
          $files = Get-ChildItem $staging -File | ForEach-Object { $_.Name }
          Push-Location $staging
          try {
            & $sevenZip a -t7z -mx=9 $archive $files
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "7z failed with exit code $LASTEXITCODE"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Move-Item $archive "dist/windows/CopyPolish-windows-x64.7z" -Force
          Copy-Item (Join-Path $staging "CopyPolish.exe") "dist/windows/CopyPolish.exe"
          Remove-Item $staging -Recurse -Force
          Get-ChildItem dist/windows

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: windows-portable
          path: |
            dist/windows/CopyPolish.exe
            dist/windows/CopyPolish-windows-x64.7z
          if-no-files-found: error

      # 构建失败时上传日志辅助排查。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.os }}
          path: |
            src-tauri/target/release/**/*.log
            frontend/npm-debug.log*
          if-no-files-found: ignore

  # Windows hosted runner 冒烟测试：真实启动 GUI，校验进程存活且主窗口出现。
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build app (skip bundling)
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- --no-bundle
      - name: Launch and verify main window
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/chinese-copywriting-formatter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Executable not found: $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru
          try {
            # 等待 WebView2 初始化并创建主窗口。
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              if ($p.HasExited) {
                Write-Error "App exited early with code $($p.ExitCode)"; exit 1
              }
              $p.Refresh()
              if ($p.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($p.HasExited) { Write-Error "App exited before showing window"; exit 1 }
            if ($p.MainWindowHandle -eq 0) {
              Write-Error "Main window did not appear within 60s"; exit 1
            }
            Write-Host "Smoke OK: process $($p.Id) alive, window '$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
            # 再保持 10 秒确认稳定运行不崩溃。
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { Write-Error "App exited during stability wait"; exit 1 }
            Write-Host "Stability OK"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

  # 推送 v* tag 时：下载双平台构建产物并自动创建 GitHub Release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, tauri-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files (ASCII names)
        run: |
          mkdir -p release-files
          cp dist/windows-portable/CopyPolish.exe release-files/
          cp dist/windows-portable/CopyPolish-windows-x64.7z release-files/
          find dist/bundle-ubuntu-latest -name '*.deb' -exec cp {} release-files/CopyPolish_linux_amd64.deb \;
          find dist/bundle-ubuntu-latest -name '*.rpm' -exec cp {} release-files/CopyPolish-linux-x86_64.rpm \;
          find dist/bundle-ubuntu-latest -name '*.AppImage' -exec cp {} release-files/CopyPolish_linux_amd64.AppImage \;
          ls -la release-files
      # 在自动生成的 notes 基础上补充固定说明（改名、设置迁移等）。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest \
            release-files/*
          gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --notes "$(gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --json body -q .body)

          ## 重要变更说明

          - Windows 便携版可执行文件更名为 \`CopyPolish.exe\`，压缩包为 \`CopyPolish-windows-x64.7z\`（压缩包根目录直接包含 exe，无嵌套目录）。
          - 用户设置现保存在程序（exe）相同目录的 \`rules.yaml\`；首次运行会自动迁移旧版 \`ccw-formatter-settings.json\` 中的规则开关与上次输入。
          - 「用 text-spacing 来挽救」说明性规则已彻底移除；「专有名词使用正确的大小写」与「不要使用不地道的缩写」默认关闭，可在设置中手动启用。"
      - name: Verify version consistency
        run: python3 scripts/check_version.py "${{ github.ref_name }}"
        if: startsWith(github.ref, 'refs/tags/v')
