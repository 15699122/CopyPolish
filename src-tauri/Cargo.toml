[package]
name = "chinese-copywriting-formatter"
version = "0.5.0"
description = "文案净排（CopyPolish）—— 本地桌面端中文文案排版工具"
authors = ["CopyPolish"]
edition = "2021"

[lib]
name = "chinese_copywriting_formatter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
# UAX #29 文本边界（grapheme cluster），roadmap §5：
# 为中英/中数插空规则提供不被 emoji ZWJ、组合附加符切断的判定单位。
unicode-segmentation = "1.12"

# Ratatui 终端界面仅在 `--features tui` 时编译，不影响默认 Tauri 构建。
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = { version = "0.2", optional = true }

# 应用为纯 Rust 实现；历史实现不参与构建、打包或测试门禁。

[[bin]]
name = "copypolish-tui"
path = "src/bin/copypolish-tui.rs"
required-features = ["tui"]
