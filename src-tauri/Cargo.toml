[package]
name = "chinese-copywriting-formatter"
version = "0.5.0"
description = "文案净排（CopyPolish）—— 本地桌面端中文文案排版工具"
authors = ["CopyPolish"]
edition = "2021"

# 参考脚手架：本机尚未安装 cargo / pkg-config / libpython，需先安装工具链后再编译。
[lib]
name = "chinese_copywriting_formatter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
# 保护层正则需要 lookbehind / backreference（LaTeX 转义 $、fenced code 缩进回引等），
# regex crate 不支持，使用 fancy-regex。
fancy-regex = "0.19"
# UAX #29 文本边界（grapheme cluster），roadmap §5：
# 为中英/中数插空规则提供不被 emoji ZWJ、组合附加符切断的判定单位。
unicode-segmentation = "1.12"

# 说明：应用为纯 Rust 实现。仓库 reference/ 目录下的 Python 文件仅作历史参考，
# 不参与构建、打包或测试门禁。
