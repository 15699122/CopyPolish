# 数学符号阶段 C 稳定回归。
# 当前只冻结保守目标：表达式内部不被拆分，且不做默认 Unicode 规范化。
# 数学表达式与紧邻单位（如 `2×3cm²`）的细粒度分隔留待后续语义 token 设计。
# 与中文直接相邻时按数学 token 边界插空；表达式内部保持完整。

- name: 偏导表达式内部保持完整
  selection:
    mode: defaults
  input: 计算∂f/∂x并比较x≤y
  expected: 计算 ∂f/∂x 并比较 x≤y

- name: 正负与乘法表达式保持内部结构
  selection:
    mode: defaults
  input: 结果为3±0.5，面积约为2×3cm²
  expected: 结果为 3±0.5，面积约为 2×3cm²

- name: 数学模式中的半角逗号保持不变
  selection:
    mode: defaults
  input: 公式$E=mc^2,F=ma$很重要
  expected: 公式 $E=mc^2,F=ma$ 很重要

- name: 比较表达式中的普通文本不被误判为单位
  selection:
    mode: only
    keys:
      - spacing.cjk-number
  input: 值≤0.05，a≥1
  expected: 值 ≤0.05，a≥1