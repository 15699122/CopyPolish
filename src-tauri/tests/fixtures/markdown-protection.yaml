# 阶段 D 稳定回归：Markdown 块级与行内保护。

- name: 双反引号行内代码保持完整
  selection:
    mode: defaults
  input: 中文``a ` b``后续GitHub
  expected: 中文 ``a ` b`` 后续 GitHub

- name: 三反引号行内代码保持完整
  selection:
    mode: defaults
  input: 中文```a `` b```后续GitHub
  expected: 中文 ```a `` b``` 后续 GitHub

- name: 嵌套括号链接保持完整
  selection:
    mode: defaults
  input: 请看[文档](https://example.com/foo_(bar_(baz)))然后继续
  expected: 请看 [文档](https://example.com/foo_(bar_(baz))) 然后继续

- name: 嵌套括号图片保持完整
  selection:
    mode: defaults
  input: 图片![示例](img/foo_(small).png)结束GitHub
  expected: 图片 ![示例](img/foo_(small).png) 结束 GitHub

- name: 未闭合链接不吞掉后续正文
  selection:
    mode: defaults
  input: 未闭合[文档](https://example.com/foo_(bar)继续GitHub
  expected: 未闭合[文档]（ https://example.com/foo_(bar)继续GitHub

- name: 未闭合反引号不吞掉后续正文
  selection:
    mode: defaults
  input: 中文``未闭合GitHub
  expected: 中文 `` 未闭合 GitHub

- name: 表格分隔行保持完整而表格正文继续格式化
  selection:
    mode: defaults
  input: |-
    | 标题GitHub | 数值5000元 |
    | :---: | ---: |
    | 内容GitHub | 价格5000元 |
  expected: |-
    | 标题 GitHub | 数值 5000 元 |
    | :---: | ---: |
    | 内容 GitHub | 价格 5000 元 |

- name: HTML 注释保持完整
  selection:
    mode: defaults
  input: |-
    文本
    <!-- 注释GitHub 5000元
    第二行10cm -->
    结束
  expected: |-
    文本
    <!-- 注释GitHub 5000元
    第二行10cm -->
    结束

- name: HTML block 保持完整而普通正文继续格式化
  selection:
    mode: defaults
  input: |-
    <div class="notice">
    在GitHub上发布5000元
    </div>
    正文在GitHub上发布
  expected: |-
    <div class="notice">
    在GitHub上发布5000元
    </div>
    正文在 GitHub 上发布

- name: 行内 HTML 标签保持完整而标签外正文继续格式化
  selection:
    mode: defaults
  input: |-
    行内<span>GitHub</span>继续
    点击<a href="https://example.com/a>b">GitHub</a>继续
    换行<br/>继续GitHub
  expected: |-
    行内 <span>GitHub</span> 继续
    点击 <a href="https://example.com/a>b">GitHub</a> 继续
    换行 <br/> 继续 GitHub

- name: 未闭合行内 HTML 标签不吞掉后续正文
  selection:
    mode: defaults
  input: 未闭合<span>GitHub继续
  expected: 未闭合 <span> GitHub 继续

- name: 转义 Markdown 标记保持完整而普通正文继续格式化
  selection:
    mode: defaults
  input: 转义\*标记\*和\_强调\_继续GitHub
  expected: 转义\*标记\*和\_强调\_继续 GitHub

- name: Markdown 硬换行保持完整而正文继续格式化
  selection:
    mode: defaults
  input: "第一行GitHub  \n第二行5000元继续"
  expected: "第一行 GitHub  \n第二行 5000 元继续"

- name: YAML front matter 保持完整而正文继续格式化
  selection:
    mode: defaults
  input: |-
    ---
    title: 在GitHub上发布
    count: 5000元
    ---
    正文在GitHub上发布
  expected: |-
    ---
    title: 在GitHub上发布
    count: 5000元
    ---
    正文在 GitHub 上发布

- name: 带 BOM 的 YAML front matter 保持完整
  selection:
    mode: defaults
  input: |-
    ﻿---
    title: 在GitHub上发布
    ---
    正文在GitHub上发布
  expected: |-
    ﻿---
    title: 在GitHub上发布
    ---
    正文在 GitHub 上发布

- name: 引用式链接定义保持完整而正文继续格式化
  selection:
    mode: defaults
  input: |-
    查看[官网][home]然后继续

      [home]: <https://example.com/a;b?x=1&y=2> "官网"
  expected: |-
    查看 [官网][home] 然后继续

      [home]: <https://example.com/a;b?x=1&y=2> "官网"