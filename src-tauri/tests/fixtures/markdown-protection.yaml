# 阶段 D 稳定回归：Markdown 块级与行内保护。

- name: 双反引号行内代码保持完整
  selection:
    mode: defaults
  input: 中文``a ` b``后续GitHub
  expected: 中文 ``a ` b`` 后续 GitHub

- name: 三反引号行内代码保持完整
  selection:
    mode: defaults
  input: 中文```a `` b```后续GitHub
  expected: 中文 ```a `` b``` 后续 GitHub

- name: 未闭合反引号不吞掉后续正文
  selection:
    mode: defaults
  input: 中文``未闭合GitHub
  expected: 中文 `` 未闭合 GitHub

- name: HTML 注释保持完整
  selection:
    mode: defaults
  input: |-
    文本
    <!-- 注释GitHub 5000元
    第二行10cm -->
    结束
  expected: |-
    文本
    <!-- 注释GitHub 5000元
    第二行10cm -->
    结束

- name: YAML front matter 保持完整而正文继续格式化
  selection:
    mode: defaults
  input: |-
    ---
    title: 在GitHub上发布
    count: 5000元
    ---
    正文在GitHub上发布
  expected: |-
    ---
    title: 在GitHub上发布
    count: 5000元
    ---
    正文在 GitHub 上发布

- name: 带 BOM 的 YAML front matter 保持完整
  selection:
    mode: defaults
  input: |-
    ﻿---
    title: 在GitHub上发布
    ---
    正文在GitHub上发布
  expected: |-
    ﻿---
    title: 在GitHub上发布
    ---
    正文在 GitHub 上发布

- name: 引用式链接定义保持完整而正文继续格式化
  selection:
    mode: defaults
  input: |-
    查看[官网][home]然后继续

      [home]: <https://example.com/a;b?x=1&y=2> "官网"
  expected: |-
    查看 [官网][home] 然后继续

      [home]: <https://example.com/a;b?x=1&y=2> "官网"