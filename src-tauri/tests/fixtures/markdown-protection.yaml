# 阶段 D 第一批稳定回归：HTML 注释保护。

- name: HTML 注释保持完整
  selection:
    mode: defaults
  input: |-
    文本
    <!-- 注释GitHub 5000元
    第二行10cm -->
    结束
  expected: |-
    文本
    <!-- 注释GitHub 5000元
    第二行10cm -->
    结束

- name: YAML front matter 保持完整而正文继续格式化
  selection:
    mode: defaults
  input: |-
    ---
    title: 在GitHub上发布
    count: 5000元
    ---
    正文在GitHub上发布
  expected: |-
    ---
    title: 在GitHub上发布
    count: 5000元
    ---
    正文在 GitHub 上发布

- name: 带 BOM 的 YAML front matter 保持完整
  selection:
    mode: defaults
  input: |-
    ﻿---
    title: 在GitHub上发布
    ---
    正文在GitHub上发布
  expected: |-
    ﻿---
    title: 在GitHub上发布
    ---
    正文在 GitHub 上发布

- name: 引用式链接定义保持完整而正文继续格式化
  selection:
    mode: defaults
  input: |-
    查看[官网][home]然后继续

      [home]: <https://example.com/a;b?x=1&y=2> "官网"
  expected: |-
    查看 [官网][home] 然后继续

      [home]: <https://example.com/a;b?x=1&y=2> "官网"