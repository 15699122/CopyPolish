- name: 行内 LaTeX 保持完整
  selection:
    mode: defaults
  input: 公式$E=mc^2$很重要
  expected: 公式 $E=mc^2$ 很重要

- name: Markdown 链接地址保持完整
  selection:
    mode: defaults
  input: 请看[GitHub链接](https://example.com/a;b?x=$1|y)然后继续
  expected: 请看 [GitHub链接](https://example.com/a;b?x=$1|y) 然后继续

- name: fenced code block 保持完整
  selection:
    mode: defaults
  input: |-
    示例：
    ```python
    print('github; $x | y')
    ```
    结束
  expected: |-
    示例：
    ```python
    print('github; $x | y')
    ```
    结束

- name: 化学式保持完整
  selection:
    mode: defaults
  input: 样品为FeCl₂·4H₂O，纯度99%
  expected: 样品为 FeCl₂·4H₂O，纯度 99%

- name: 同文含化学式时普通缩写连字符复合词不被拆开
  selection:
    mode: defaults
  input: |-
    - 不与MIONPs、Fe²⁺或多巴胺端基直接接触的常规清洁
    - 20 mmol/L Tris缓冲液和DA-PEG-DA/PEG 6000配体溶液的配制。
  expected: |-
    - 不与 MIONPs、 Fe²⁺ 或多巴胺端基直接接触的常规清洁
    - 20 mmol/L Tris 缓冲液和 DA-PEG-DA/PEG 6000 配体溶液的配制。

- name: 配位化合物方括号化学式内部半角括号保持
  selection:
    mode: defaults
  input: 配合物[Fe(CN)₆]³⁻与K₃[Fe(CN)₆]在溶液中
  expected: 配合物 [Fe(CN)₆]³⁻ 与 K₃[Fe(CN)₆] 在溶液中

- name: 沉淀式与氢氧化物圆括号分组化学式保持
  selection:
    mode: defaults
  input: 溶液含Ca(OH)₂和Al₂(SO₄)₃，pH为7
  expected: 溶液含 Ca(OH)₂ 和 Al₂(SO₄)₃，pH 为 7

- name: 铵盐圆括号分组化学式保持
  selection:
    mode: defaults
  input: 加入(NH₄)₂SO₄后继续GitHub
  expected: 加入 (NH₄)₂SO₄ 后继续 GitHub

- name: 复杂LaTeX命令与定界保持完整
  selection:
    mode: defaults
  input: 公式\frac{a+b}{c-d}和\sqrt[3]{x_1}以及行内\(\alpha+\beta=\gamma\)定界
  expected: 公式 \frac{a+b}{c-d} 和 \sqrt[3]{x_1} 以及行内 \(\alpha+\beta=\gamma\) 定界

- name: 中文与LaTeX化学式链接混排
  selection:
    mode: defaults
  input: 由[维基](https://zh.wikipedia.org/wiki/Fe_(CN))可知，\(K_3[Fe(CN)_6]\)的pH为7
  expected: 由 [维基](https://zh.wikipedia.org/wiki/Fe_(CN)) 可知，\(K_3[Fe(CN)_6]\) 的 pH 为 7

- name: 未闭合LaTeX定界符不被改写
  selection:
    mode: defaults
  input: 未闭合\(abc继续GitHub
  expected: 未闭合 \(abc 继续 GitHub

- name: 未闭合HTML标签内的属性保持
  selection:
    mode: defaults
  input: 未闭合<div class="x">继续GitHub
  expected: 未闭合 <div class="x"> 继续 GitHub
